[package]
name = "lineprior"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Explainable action ranking from historical sequences, with confidence, context backoff, evaluation, and tuning."
keywords = ["decision-making", "action-selection", "action-ranking", "selective-prediction", "opening-book"]
categories = ["algorithms", "artificial-intelligence"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "scoring"
harness = false
