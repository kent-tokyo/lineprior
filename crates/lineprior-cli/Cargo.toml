[package]
name = "lineprior-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "CLI for building, evaluating, tuning, and querying explainable action-ranking prior books."
keywords = ["cli", "action-ranking", "action-selection", "decision-making", "opening-book"]
categories = ["command-line-utilities", "algorithms", "artificial-intelligence"]

[[bin]]
name = "lineprior"
path = "src/main.rs"

[dependencies]
lineprior = { path = "../lineprior", version = "0.11.0" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
