name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked

  candidate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: sh scripts/check_candidate_contract.sh

  examples-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sh scripts/run_ecosystem_matrix_smoke.sh --out ecosystem-runtime.json
      - run: python3 scripts/validate_ecosystem_runtime.py ecosystem-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: ecosystem-runtime-${{ github.run_id }}
          path: ecosystem-runtime.json
          if-no-files-found: error

  wasm-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: sh scripts/run_wasm_build_smoke.sh --out wasm-runtime.json
      - run: python3 scripts/validate_wasm_runtime.py wasm-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-runtime-${{ github.run_id }}
          path: wasm-runtime.json
          if-no-files-found: error

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
