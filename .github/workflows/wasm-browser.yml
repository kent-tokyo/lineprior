name: WASM browser smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "crates/lineprior-wasm/**"
      - "crates/lineprior/**"
      - "examples/wasm/**"
      - ".github/workflows/wasm-browser.yml"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-pack and browser
        run: |
          cargo install wasm-pack --locked --version 0.15.0
          npm ci --prefix examples/wasm --ignore-scripts=false
          npx --prefix examples/wasm playwright install --with-deps chromium
      - name: Pack, clean-install, and test the web package
        run: sh scripts/run_npm_package_smoke.sh --out npm-package-runtime.json
      - name: Validate package evidence
        run: python3 scripts/validate_npm_package_runtime.py npm-package-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: npm-wasm-package-${{ github.run_id }}
          path: npm-package-runtime.json
          if-no-files-found: error
